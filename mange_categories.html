<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Manage Categories</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 800px;
      margin: auto;
    }

    h2 {
      margin-bottom: 10px;
    }

    .category-block {
      border: 1px solid #ccc;
      padding: 15px;
      margin-top: 15px;
      border-radius: 6px;
    }

    .subcategory-block {
      margin-left: 20px;
      padding: 10px;
      border-left: 3px solid #ddd;
    }

    .subsubcategory-block {
      margin-left: 40px;
      padding: 5px;
      border-left: 2px dashed #ccc;
    }

    button {
      padding: 6px 10px;
      margin-left: 10px;
      cursor: pointer;
    }

    .modal-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      display: none;
      justify-content: center;
      align-items: center;
    }

    .modal {
      background: white;
      padding: 20px;
      border-radius: 8px;
      width: 300px;
      text-align: center;
    }

    .modal input {
      width: 90%;
      margin-top: 10px;
      padding: 6px;
    }

    .modal button {
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <h2>Manage Categories</h2>
  <button onclick="openAddCategoryModal()">+ Add Category</button>

  <div id="categoryContainer"></div>

  <!-- MODAL -->
  <div id="modalBg" class="modal-bg">
    <div class="modal">
      <h3 id="modalTitle"></h3>
      <input id="modalInput" type="text" placeholder="Enter value">
      <br>
      <button onclick="saveModal()">Save</button>
      <button onclick="closeModal()">Cancel</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="supabase.js"></script>

  <script>
    let modalMode = null;
    let modalCategory = null;
    let modalSubcategory = null;

    document.addEventListener("DOMContentLoaded", loadCategories);

    async function loadCategories() {
      const ingredients = await getIngredients();
      const container = document.getElementById("categoryContainer");
      container.innerHTML = "";

      const categories = [...new Set(ingredients.map(i => i.category).filter(Boolean))];

      categories.forEach(category => {
        const catDiv = document.createElement("div");
        catDiv.className = "category-block";

        catDiv.innerHTML = `
          <strong>${category}</strong>
          <button onclick="openAddSubcategoryModal('${category}')">+ Add Subcategory</button>
        `;

        const subcategories = [...new Set(
          ingredients
            .filter(i => i.category === category)
            .map(i => i.subcategory)
            .filter(Boolean)
        )];

        subcategories.forEach(sub => {
          const subDiv = document.createElement("div");
          subDiv.className = "subcategory-block";

          subDiv.innerHTML = `
            <strong>${sub}</strong>
            <button onclick="openAddSubSubcategoryModal('${category}', '${sub}')">+ Add Sub‑subcategory</button>
          `;

          const subsubs = [...new Set(
            ingredients
              .filter(i => i.category === category && i.subcategory === sub)
              .map(i => i.subsubcategory)
              .filter(Boolean)
          )];

          subsubs.forEach(ss => {
            const ssDiv = document.createElement("div");
            ssDiv.className = "subsubcategory-block";
            ssDiv.textContent = ss;
            subDiv.appendChild(ssDiv);
          });

          catDiv.appendChild(subDiv);
        });

        container.appendChild(catDiv);
      });
    }

    /* -------------------------
       MODAL HANDLING
    --------------------------*/

    function openAddCategoryModal() {
      modalMode = "category";
      modalCategory = null;
      modalSubcategory = null;

      document.getElementById("modalTitle").textContent = "Add Category";
      document.getElementById("modalInput").value = "";
      document.getElementById("modalBg").style.display = "flex";
    }

    function openAddSubcategoryModal(category) {
      modalMode = "subcategory";
      modalCategory = category;

      document.getElementById("modalTitle").textContent = `Add Subcategory to "${category}"`;
      document.getElementById("modalInput").value = "";
      document.getElementById("modalBg").style.display = "flex";
    }

    function openAddSubSubcategoryModal(category, subcategory) {
      modalMode = "subsubcategory";
      modalCategory = category;
      modalSubcategory = subcategory;

      document.getElementById("modalTitle").textContent = `Add Sub‑subcategory to "${subcategory}"`;
      document.getElementById("modalInput").value = "";
      document.getElementById("modalBg").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("modalBg").style.display = "none";
    }

    async function saveModal() {
      const value = document.getElementById("modalInput").value.trim();
      if (!value) return;

      if (modalMode === "category") {
        await addIngredient({ name: "(placeholder)", category: value });
      }

      if (modalMode === "subcategory") {
        await addIngredient({
          name: "(placeholder)",
          category: modalCategory,
          subcategory: value
        });
      }

      if (modalMode === "subsubcategory") {
        await addIngredient({
          name: "(placeholder)",
          category: modalCategory,
          subcategory: modalSubcategory,
          subsubcategory: value
        });
      }

      closeModal();
      await loadCategories();
    }
  </script>

</body>
</html>
