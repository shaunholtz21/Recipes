<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>View Recipe</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 800px;
      margin: auto;
    }

    h2 {
      margin-bottom: 5px;
    }

    .section {
      margin-top: 25px;
    }

    .ingredient-item, .step-item {
      padding: 8px;
      border-bottom: 1px solid #ddd;
      margin-top: 5px;
    }

    button {
      padding: 8px 12px;
      margin-top: 20px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h2 id="recipeName"></h2>
  <p id="recipeCategory"></p>
  <p id="recipeNotes"></p>

  <div class="section">
    <h3>Ingredients</h3>
    <div id="ingredientsList"></div>
  </div>

  <div class="section">
    <h3>Steps</h3>
    <div id="stepsList"></div>
  </div>

  <button onclick="editRecipe()">Edit Recipe</button>
  <button onclick="window.location.href='index.html'">Back to Recipes</button>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@1.35.7"></script>
  <script src="supabase.js"></script>

  <script>
    // Get recipe ID from URL
    const params = new URLSearchParams(window.location.search);
    const recipeId = params.get("id");

    document.addEventListener("DOMContentLoaded", loadRecipe);

    async function loadRecipe() {
      if (!recipeId) {
        alert("No recipe ID provided");
        return;
      }

      // Fetch recipe basics
      const recipe = await getRecipe(recipeId);

      document.getElementById("recipeName").textContent = recipe.name;
      document.getElementById("recipeCategory").textContent = recipe.category || "";
      document.getElementById("recipeNotes").textContent = recipe.notes || "";

      // Fetch ingredients
      const { data: ingredients, error: ingErr } = await supabase
        .from("recipe_ingredients")
        .select("*, ingredients(*)")
        .eq("recipe_id", recipeId)
        .order("id", { ascending: true });

      if (ingErr) console.error(ingErr);

      const ingList = document.getElementById("ingredientsList");
      ingList.innerHTML = "";

      ingredients.forEach(item => {
        const ing = item.ingredients;

        let label = ing.name;
        if (ing.category) label = `${ing.category} → ${label}`;
        if (ing.subcategory) label = `${ing.category} → ${ing.subcategory} → ${ing.name}`;
        if (ing.subsubcategory) label = `${ing.category} → ${ing.subcategory} → ${ing.subsubcategory} → ${ing.name}`;

        const div = document.createElement("div");
        div.className = "ingredient-item";
        div.textContent = `${item.quantity} ${item.unit} — ${label}`;
        ingList.appendChild(div);
      });

      // Fetch steps
      const { data: steps, error: stepErr } = await supabase
        .from("steps")
        .select("*")
        .eq("recipe_id", recipeId)
        .order("step_number", { ascending: true });

      if (stepErr) console.error(stepErr);

      const stepList = document.getElementById("stepsList");
      stepList.innerHTML = "";

      steps.forEach(s => {
        const div = document.createElement("div");
        div.className = "step-item";
        div.textContent = `${s.step_number}. ${s.instruction}`;
        stepList.appendChild(div);
      });
    }

    function editRecipe() {
      window.location.href = `edit.html?id=${recipeId}`;
    }
  </script>

</body>
</html>
