<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>View Recipe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="site-nav">
    <span class="brand">🍲 Family Recipes</span>
    <a href="index.html">Recipes</a>
    <a href="ingredients.html">Ingredients</a>
    <a href="categories.html">Categories</a>
  </nav>

  <h2 id="recipeName"></h2>
  <p id="recipeCategory" class="card-subtitle"></p>
  <div class="row" id="timesRow" style="margin-top: 8px;"></div>
  <p id="recipeNotes"></p>

  <div class="section">
    <h3>Ingredients</h3>
    <div id="ingredientsList"></div>
  </div>

  <div class="section">
    <h3>Directions</h3>
    <div id="stepsList"></div>
  </div>

  <div class="actions">
    <button class="primary" onclick="editRecipe()">Edit Recipe</button>
    <button onclick="window.location.href='index.html'">Back to Recipes</button>
    <button class="danger" style="margin-left:auto;" onclick="removeRecipe()">Delete Recipe</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@1.35.7"></script>
  <script src="supabase.js"></script>

  <script>
    const params = new URLSearchParams(window.location.search);
    const recipeId = params.get("id");

    document.addEventListener("DOMContentLoaded", loadRecipe);

    async function loadRecipe() {
      if (!recipeId) {
        alert("No recipe ID provided");
        return;
      }

      const recipe = await getRecipe(recipeId);

      document.getElementById("recipeName").textContent = recipe.name;
      document.getElementById("recipeCategory").textContent = recipe.category || "";
      document.getElementById("recipeNotes").textContent = recipe.notes || "";

      const times = [];
      if (recipe.servings) times.push(`<span><strong>Servings:</strong> ${recipe.servings}</span>`);
      if (recipe.prep_time) times.push(`<span><strong>Prep:</strong> ${recipe.prep_time}</span>`);
      if (recipe.cook_time) times.push(`<span><strong>Cook:</strong> ${recipe.cook_time}</span>`);
      if (recipe.total_time) times.push(`<span><strong>Total:</strong> ${recipe.total_time}</span>`);
      document.getElementById("timesRow").innerHTML = times.join(" &nbsp;•&nbsp; ");

      const ingredients = await getRecipeIngredients(recipeId);
      const ingList = document.getElementById("ingredientsList");
      ingList.innerHTML = "";

      if (ingredients.length === 0) {
        ingList.innerHTML = `<p class="muted">No ingredients listed.</p>`;
      } else {
        ingredients.forEach(item => {
          const ing = item.ingredients;
          const div = document.createElement("div");
          div.className = "card";
          div.textContent = `${item.quantity || ""} ${item.unit || ""} — ${ing.name}`.trim();
          ingList.appendChild(div);
        });
      }

      const steps = await getRecipeSteps(recipeId);
      const stepList = document.getElementById("stepsList");
      stepList.innerHTML = "";

      if (steps.length === 0) {
        stepList.innerHTML = `<p class="muted">No directions listed.</p>`;
      } else {
        steps.forEach(s => {
          const div = document.createElement("div");
          div.className = "card";
          div.textContent = `${s.step_number}. ${s.instruction}`;
          stepList.appendChild(div);
        });
      }
    }

    function editRecipe() {
      window.location.href = `recipe-form.html?id=${recipeId}`;
    }

    async function removeRecipe() {
      if (!confirm("Delete this recipe? This cannot be undone.")) return;

      try {
        await deleteRecipe(recipeId);
        window.location.href = "index.html";
      } catch (err) {
        alert("Could not delete recipe: " + err.message);
      }
    }
  </script>

</body>
</html>
