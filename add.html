<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Add Recipe</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 700px;
      margin: auto;
    }

    .step {
      display: none;
    }

    .step.active {
      display: block;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input, textarea, select {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
    }

    button {
      padding: 8px 12px;
      cursor: pointer;
    }

    .ingredient-row, .step-row {
      padding: 8px;
      border-bottom: 1px solid #ddd;
      margin-top: 10px;
    }

    .nav-buttons {
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <h2>Add New Recipe</h2>

  <!-- STEP 1: BASICS -->
  <div id="step1" class="step active">
    <label>Recipe Name</label>
    <input id="recipeName" type="text">

    <label>Recipe Category</label>
    <input id="recipeCategory" type="text">

    <label>Notes</label>
    <textarea id="recipeNotes" rows="4"></textarea>

    <div class="nav-buttons">
      <button onclick="nextStep()">Next →</button>
    </div>
  </div>

  <!-- STEP 2: INGREDIENTS -->
  <div id="step2" class="step">
    <h3>Ingredients</h3>

    <label>Category</label>
    <select id="categorySelect" onchange="loadSubcategories()"></select>

    <label>Subcategory</label>
    <select id="subcategorySelect" onchange="loadSubSubcategories()"></select>

    <label>Sub‑subcategory</label>
    <select id="subsubcategorySelect" onchange="loadIngredientNames()"></select>

    <label>Ingredient</label>
    <select id="ingredientSelect"></select>

    <label>Quantity</label>
    <input id="ingredientQty" type="text">

    <label>Unit</label>
    <input id="ingredientUnit" type="text">

    <div style="display: flex; gap: 10px; margin-top: 20px;">
      <button onclick="addIngredientToList()">Add Ingredient</button>
      <button onclick="openIngredientPopup()">+ Add New Ingredient</button>
    </div>

    <h4>Ingredient List</h4>
    <div id="ingredientList"></div>

    <div class="nav-buttons">
      <button onclick="prevStep()">← Back</button>
      <button onclick="nextStep()">Next →</button>
    </div>
  </div>

  <!-- STEP 3: STEPS -->
  <div id="step3" class="step">
    <h3>Steps</h3>

    <label>Instruction</label>
    <textarea id="stepInstruction" rows="3"></textarea>

    <button onclick="addStepToList()">Add Step</button>

    <h4>Steps</h4>
    <div id="stepsList"></div>

    <div class="nav-buttons">
      <button onclick="prevStep()">← Back</button>
      <button onclick="nextStep()">Next →</button>
    </div>
  </div>

  <!-- STEP 4: REVIEW -->
  <div id="step4" class="step">
    <h3>Review Recipe</h3>

    <div id="reviewSection"></div>

    <div class="nav-buttons">
      <button onclick="prevStep()">← Back</button>
      <button onclick="saveRecipe()">Save Recipe</button>
    </div>
  </div>

  <!-- STEP 5: DONE -->
  <div id="step5" class="step">
    <h3>Recipe Saved!</h3>
    <p>Your recipe has been added.</p>
    <button onclick="window.location.href='index.html'">Back to Recipes</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@1.35.7"></script>
  <script src="supabase.js"></script>

  <script>
    let currentStep = 1;
    let ingredients = [];
    let steps = [];

    document.addEventListener("DOMContentLoaded", async () => {
      await loadCategories();
    });

    function showStep(n) {
      document.querySelectorAll(".step").forEach(s => s.classList.remove("active"));
      document.getElementById("step" + n).classList.add("active");
    }

    function nextStep() {
      currentStep++;
      if (currentStep === 4) buildReview();
      showStep(currentStep);
    }

    function prevStep() {
      currentStep--;
      showStep(currentStep);
    }

    /* -------------------------
       CATEGORY → SUBCATEGORY → SUBSUB → INGREDIENT
       (skip empty levels)
    --------------------------*/

    async function loadCategories() {
      const cats = await getCategories();
      const sel = document.getElementById("categorySelect");

      sel.innerHTML = "<option value=''>-- Select --</option>";
      cats.forEach(c => sel.innerHTML += `<option>${c}</option>`);

      document.getElementById("subcategorySelect").innerHTML = "";
      document.getElementById("subsubcategorySelect").innerHTML = "";
      document.getElementById("ingredientSelect").innerHTML = "";
    }

    async function loadSubcategories() {
      const cat = document.getElementById("categorySelect").value;
      const subs = await getSubcategories(cat);
      const sel = document.getElementById("subcategorySelect");

      sel.innerHTML = "<option value=''>-- Select --</option>";

      if (subs.length === 0) {
        sel.innerHTML = "";
        document.getElementById("subsubcategorySelect").innerHTML = "";
        loadIngredientNames();
        return;
      }

      subs.forEach(s => sel.innerHTML += `<option>${s}</option>`);

      document.getElementById("subsubcategorySelect").innerHTML = "";
      document.getElementById("ingredientSelect").innerHTML = "";
    }

    async function loadSubSubcategories() {
      const cat = document.getElementById("categorySelect").value;
      const sub = document.getElementById("subcategorySelect").value;

      const subs = await getSubSubcategories(cat, sub);
      const sel = document.getElementById("subsubcategorySelect");

      sel.innerHTML = "<option value=''>-- Select --</option>";

      if (subs.length === 0) {
        sel.innerHTML = "";
        loadIngredientNames();
        return;
      }

      subs.forEach(s => sel.innerHTML += `<option>${s}</option>`);

      document.getElementById("ingredientSelect").innerHTML = "";
    }

    async function loadIngredientNames() {
      const cat = document.getElementById("categorySelect").value;
      const sub = document.getElementById("subcategorySelect").value;
      const subsub = document.getElementById("subsubcategorySelect").value;

      const all = await getIngredients();
      const filtered = all.filter(i =>
        i.category === cat &&
        (sub ? i.subcategory === sub : true) &&
        (subsub ? i.subsubcategory === subsub : true)
      );

      const sel = document.getElementById("ingredientSelect");
      sel.innerHTML = "<option value=''>-- Select --</option>";
      filtered.forEach(i => sel.innerHTML += `<option value="${i.id}">${i.name}</option>`);
    }

    function openIngredientPopup() {
      window.open("add_ingredient.html", "_blank", "width=500,height=600");
    }

    /* -------------------------
       INGREDIENT LIST
    --------------------------*/

    function addIngredientToList() {
      const id = document.getElementById("ingredientSelect").value;
      const qty = document.getElementById("ingredientQty").value.trim();
      const unit = document.getElementById("ingredientUnit").value.trim();

      if (!id) return alert("Select an ingredient");
      if (!qty) return alert("Enter quantity");

      ingredients.push({ id, qty, unit });

      const div = document.createElement("div");
      div.className = "ingredient-row";
      div.textContent = `${qty} ${unit} — Ingredient #${id}`;
      document.getElementById("ingredientList").appendChild(div);

      document.getElementById("ingredientQty").value = "";
      document.getElementById("ingredientUnit").value = "";
    }

    /* -------------------------
       STEPS
    --------------------------*/

    function addStepToList() {
      const instruction = document.getElementById("stepInstruction").value.trim();
      if (!instruction) return;

      steps.push(instruction);

      const div = document.createElement("div");
      div.className = "step-row";
      div.textContent = `${steps.length}. ${instruction}`;
      document.getElementById("stepsList").appendChild(div);

      document.getElementById("stepInstruction").value = "";
    }

    /* -------------------------
       REVIEW
    --------------------------*/

    function buildReview() {
      const name = document.getElementById("recipeName").value;
      const category = document.getElementById("recipeCategory").value;
      const notes = document.getElementById("recipeNotes").value;

      let html = `
        <strong>Name:</strong> ${name}<br>
        <strong>Category:</strong> ${category}<br>
        <strong>Notes:</strong> ${notes}<br><br>

        <strong>Ingredients:</strong><br>
      `;

      ingredients.forEach((i, idx) => {
        html += `${idx + 1}. ${i.qty} ${i.unit} (Ingredient ID: ${i.id})<br>`;
      });

      html += `<br><strong>Steps:</strong><br>`;
      steps.forEach((s, idx) => {
        html += `${idx + 1}. ${s}<br>`;
      });

      document.getElementById("reviewSection").innerHTML = html;
    }

    /* -------------------------
       SAVE RECIPE
    --------------------------*/

    async function saveRecipe() {
      const name = document.getElementById("recipeName").value.trim();
      const category = document.getElementById("recipeCategory").value.trim();
      const notes = document.getElementById("recipeNotes").value.trim();

      if (!name) return alert("Recipe name required");

      const recipe = await addRecipeBasics({ name, category, notes });

      for (const ing of ingredients) {
        await addRecipeIngredient({
          recipe_id: recipe.id,
          ingredient_id: ing.id,
          quantity: ing.qty,
          unit: ing.unit
        });
      }

      for (let i = 0; i < steps.length; i++) {
        await addRecipeStep({
          recipe_id: recipe.id,
          step_number: i + 1,
          instruction: steps[i]
        });
      }

      showStep(5);
    }
  </script>

</body>
</html>
