<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Add Recipe</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 700px;
      margin: auto;
    }

    .step {
      display: none;
    }

    .step.active {
      display: block;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input, textarea, select {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
    }

    button {
      padding: 8px 12px;
      margin-top: 20px;
      cursor: pointer;
    }

    .ingredient-row {
      padding: 8px;
      border-bottom: 1px solid #ddd;
      margin-top: 10px;
    }

    .step-row {
      padding: 8px;
      border-bottom: 1px solid #ddd;
      margin-top: 10px;
    }

    .nav-buttons {
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <h2>Add New Recipe</h2>

  <!-- STEP 1: BASICS -->
  <div id="step1" class="step active">
    <label>Recipe Name</label>
    <input id="recipeName" type="text">

    <label>Recipe Category</label>
    <input id="recipeCategory" type="text" placeholder="e.g., Dinner, Dessert">

    <label>Notes</label>
    <textarea id="recipeNotes" rows="4"></textarea>

    <div class="nav-buttons">
      <button onclick="nextStep()">Next →</button>
    </div>
  </div>

  <!-- STEP 2: INGREDIENTS -->
  <div id="step2" class="step">
    <h3>Ingredients</h3>

    <label>Select Ingredient</label>
    <select id="ingredientSelect"></select>

    <button onclick="openIngredientPopup()">+ Add Ingredient</button>

    <label>Quantity</label>
    <input id="ingredientQty" type="text">

    <label>Unit</label>
    <input id="ingredientUnit" type="text" placeholder="e.g., cups, tbsp, grams">

    <button onclick="addIngredientToList()">Add Ingredient</button>

    <h4>Ingredient List</h4>
    <div id="ingredientList"></div>

    <div class="nav-buttons">
      <button onclick="prevStep()">← Back</button>
      <button onclick="nextStep()">Next →</button>
    </div>
  </div>

  <!-- STEP 3: STEPS -->
  <div id="step3" class="step">
    <h3>Steps</h3>

    <label>Instruction</label>
    <textarea id="stepInstruction" rows="3"></textarea>

    <button onclick="addStepToList()">Add Step</button>

    <h4>Steps</h4>
    <div id="stepsList"></div>

    <div class="nav-buttons">
      <button onclick="prevStep()">← Back</button>
      <button onclick="nextStep()">Next →</button>
    </div>
  </div>

  <!-- STEP 4: REVIEW -->
  <div id="step4" class="step">
    <h3>Review Recipe</h3>

    <div id="reviewSection"></div>

    <div class="nav-buttons">
      <button onclick="prevStep()">← Back</button>
      <button onclick="saveRecipe()">Save Recipe</button>
    </div>
  </div>

  <!-- STEP 5: DONE -->
  <div id="step5" class="step">
    <h3>Recipe Saved!</h3>
    <p>Your recipe has been added.</p>
    <button onclick="window.location.href='index.html'">Back to Recipes</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="supabase.js"></script>

    let currentStep = 1;
    let ingredients = [];
    let steps = [];

      await loadIngredients();
    });
