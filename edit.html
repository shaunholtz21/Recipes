<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Edit Recipe</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 700px;
      margin: auto;
    }

    .section {
      margin-top: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input, textarea, select {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
    }

    button {
      padding: 8px 12px;
      cursor: pointer;
    }

    .ingredient-row, .step-row {
      padding: 8px;
      border-bottom: 1px solid #ddd;
      margin-top: 10px;
    }

    .delete-btn {
      float: right;
      color: red;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h2>Edit Recipe</h2>

  <!-- BASICS -->
  <div class="section">
    <label>Recipe Name</label>
    <input id="recipeName" type="text">

    <label>Recipe Category</label>
    <input id="recipeCategory" type="text">

    <label>Notes</label>
    <textarea id="recipeNotes" rows="4"></textarea>
	
	<label>Prep Time</label>
    <input id="prepTime" type="text">

    <label>Cook Time</label>
    <input id="cookTime" type="text">

    <label>Total Time</label>
    <input id="totalTime" type="text">

  </div>

  <!-- INGREDIENTS -->
  <div class="section">
    <h3>Ingredients</h3>

    <label>Category</label>
    <select id="categorySelect" onchange="loadSubcategories()"></select>

    <label>Subcategory</label>
    <select id="subcategorySelect" onchange="loadSubSubcategories()"></select>

    <label>Sub‑subcategory</label>
    <select id="subsubcategorySelect" onchange="loadIngredientNames()"></select>

    <label>Ingredient</label>
    <select id="ingredientSelect"></select>

    <label>Quantity</label>
    <input id="ingredientQty" type="text">

    <label>Unit</label>
    <input id="ingredientUnit" type="text">

    <div style="margin-top: 20px;">
      <button onclick="addIngredientToList()">Add Ingredient</button>
    </div>

    <h4>Ingredient List</h4>
    <div id="ingredientList"></div>
  </div>

  <!-- STEPS -->
  <div class="section">
    <h3>Steps</h3>

    <label>Instruction</label>
    <textarea id="stepInstruction" rows="3"></textarea>

    <button onclick="addStepToList()">Add Step</button>

    <h4>Steps</h4>
    <div id="stepsList"></div>
  </div>

  <button onclick="saveRecipe()">Save Changes</button>
  <button onclick="window.location.href='index.html'">Cancel</button>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@1.35.7"></script>
  <script src="supabase.js"></script>

  <script>
    const params = new URLSearchParams(window.location.search);
    const recipeId = params.get("id");

    let ingredients = [];
    let steps = [];

    document.addEventListener("DOMContentLoaded", async () => {
      await loadCategories();
      await loadRecipe();
    });

    /* -------------------------
       LOAD EXISTING RECIPE
    --------------------------*/

    async function loadRecipe() {
      if (!recipeId) {
        alert("No recipe ID provided");
        return;
      }

      const recipe = await getRecipe(recipeId);

      document.getElementById("recipeName").value = recipe.name;
      document.getElementById("recipeCategory").value = recipe.category || "";
      document.getElementById("recipeNotes").value = recipe.notes || "";
	  document.getElementById("prepTime").value = recipe.prep_time || "";
      document.getElementById("cookTime").value = recipe.cook_time || "";
      document.getElementById("totalTime").value = recipe.total_time || "";

      const { data: ingRows } = await supabase
        .from("recipe_ingredients")
        .select("*, ingredients(*)")
        .eq("recipe_id", recipeId)
        .order("id", { ascending: true });

      ingredients = ingRows.map(r => ({
        id: r.ingredient_id,
		name: r.ingredients.name,
        qty: r.quantity,
        unit: r.unit
      }));

      renderIngredientList();

      const { data: stepRows } = await supabase
        .from("steps")
        .select("*")
        .eq("recipe_id", recipeId)
        .order("step_number", { ascending: true });

      steps = stepRows.map(s => s.instruction);

      renderStepList();
    }

    /* -------------------------
       CATEGORY → SUBCATEGORY → SUBSUB → INGREDIENT
       (skip empty levels)
    --------------------------*/

    async function loadCategories() {
      const cats = await getCategories();
      const sel = document.getElementById("categorySelect");

      sel.innerHTML = "<option value=''>-- Select --</option>";
      cats.forEach(c => sel.innerHTML += `<option>${c}</option>`);

      document.getElementById("subcategorySelect").innerHTML = "";
      document.getElementById("subsubcategorySelect").innerHTML = "";
      document.getElementById("ingredientSelect").innerHTML = "";
    }

    async function loadSubcategories() {
      const cat = document.getElementById("categorySelect").value;
      const subs = await getSubcategories(cat);
      const sel = document.getElementById("subcategorySelect");

      sel.innerHTML = "<option value=''>-- Select --</option>";

      if (subs.length === 0) {
        sel.innerHTML = "";
        document.getElementById("subsubcategorySelect").innerHTML = "";
        loadIngredientNames();
        return;
      }

      subs.forEach(s => sel.innerHTML += `<option>${s}</option>`);

      document.getElementById("subsubcategorySelect").innerHTML = "";
      document.getElementById("ingredientSelect").innerHTML = "";
    }

    async function loadSubSubcategories() {
      const cat = document.getElementById("categorySelect").value;
      const sub = document.getElementById("subcategorySelect").value;

      const subs = await getSubSubcategories(cat, sub);
      const sel = document.getElementById("subsubcategorySelect");

      sel.innerHTML = "<option value=''>-- Select --</option>";

      if (subs.length === 0) {
        sel.innerHTML = "";
        loadIngredientNames();
        return;
      }

      subs.forEach(s => sel.innerHTML += `<option>${s}</option>`);

      document.getElementById("ingredientSelect").innerHTML = "";
    }

    async function loadIngredientNames() {
      const cat = document.getElementById("categorySelect").value;
      const sub = document.getElementById("subcategorySelect").value;
      const subsub = document.getElementById("subsubcategorySelect").value;

      const all = await getIngredients();
      const filtered = all.filter(i =>
        i.category === cat &&
        (sub ? i.subcategory === sub : true) &&
        (subsub ? i.subsubcategory === subsub : true)
      );

      const sel = document.getElementById("ingredientSelect");
      sel.innerHTML = "<option value=''>-- Select --</option>";
      filtered.forEach(i => sel.innerHTML += `<option value="${i.id}">${i.name}</option>`);
    }

    /* -------------------------
       INGREDIENT LIST
    --------------------------*/

function addIngredientToList() {
  const select = document.getElementById("ingredientSelect");
  const id = select.value;
  const option = select.selectedOptions[0];

  if (!id || !option) {
    alert("Select an ingredient");
    return;
  }

  const name = option.textContent;
  const qty = document.getElementById("ingredientQty").value.trim();
  const unit = document.getElementById("ingredientUnit").value.trim();

  if (!qty) {
    alert("Enter quantity");
    return;
  }

  ingredients.push({ id, name, qty, unit });

  const div = document.createElement("div");
  div.className = "ingredient-row";
  div.textContent = `${qty} ${unit} — ${name}`;
  document.getElementById("ingredientList").appendChild(div);

  document.getElementById("ingredientQty").value = "";
  document.getElementById("ingredientUnit").value = "";
}

    function deleteIngredient(index) {
      ingredients.splice(index, 1);
      renderIngredientList();
    }

function renderIngredientList() {
  const container = document.getElementById("ingredientList");
  container.innerHTML = "";

  ingredients.forEach((ing, idx) => {
    const div = document.createElement("div");
    div.className = "ingredient-row";
    div.innerHTML = `
      ${ing.qty} ${ing.unit} — ${ing.name}
      <span class="delete-btn" onclick="deleteIngredient(${idx})">✖</span>
    `;
    container.appendChild(div);
  });
}

    /* -------------------------
       STEPS
    --------------------------*/

    function addStepToList() {
      const instruction = document.getElementById("stepInstruction").value.trim();
      if (!instruction) return;

      steps.push(instruction);
      renderStepList();

      document.getElementById("stepInstruction").value = "";
    }

    function renderStepList() {
      const container = document.getElementById("stepsList");
      container.innerHTML = "";

      steps.forEach((s, idx) => {
        const div = document.createElement("div");
        div.className = "step-row";
        div.innerHTML = `
          ${idx + 1}. ${s}
          <span class="delete-btn" onclick="deleteStep(${idx})">✖</span>
        `;
        container.appendChild(div);
      });
    }

    function deleteStep(index) {
      steps.splice(index, 1);
      renderStepList();
    }

    /* -------------------------
       SAVE CHANGES
    --------------------------*/

    async function saveRecipe() {
      const name = document.getElementById("recipeName").value.trim();
      const category = document.getElementById("recipeCategory").value.trim();
      const notes = document.getElementById("recipeNotes").value.trim();

      if (!name) return alert("Recipe name required");

      await supabase
  .from("recipes")
  .update({
    name,
    category,
    notes,
    prep_time: document.getElementById("prepTime").value.trim(),
    cook_time: document.getElementById("cookTime").value.trim(),
    total_time: document.getElementById("totalTime").value.trim()
  })
  .eq("id", recipeId);

      await supabase
        .from("recipe_ingredients")
        .delete()
        .eq("recipe_id", recipeId);

      for (const ing of ingredients) {
        await addRecipeIngredient({
          recipe_id: recipeId,
          ingredient_id: ing.id,
          quantity: ing.qty,
          unit: ing.unit
        });
      }

      await supabase
        .from("steps")
        .delete()
        .eq("recipe_id", recipeId);

      for (let i = 0; i < steps.length; i++) {
        await addRecipeStep({
          recipe_id: recipeId,
          step_number: i + 1,
          instruction: steps[i]
        });
      }

      alert("Recipe updated");
      window.location.href = `view.html?id=${recipeId}`;
    }
  </script>

</body>
</html>
